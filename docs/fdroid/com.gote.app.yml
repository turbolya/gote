Builds:
  - versionName: 2.46.0
    versionCode: 24600
    commit: v2.46.0
    sudo:
      - apt-get update
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz
      - echo "9d942932535988091034dc94cc5f42b6dc8784d6366df3a36c4c9ccb3996f0c2 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init: npm ci --ignore-scripts
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - echo EXPO_PUBLIC_FDROID=1 > .env
      - sdkmanager 'cmake;3.22.1'
      - npm pkg set --json 'expo.autolinking.android.buildFromSource=[".*"]'
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - find node_modules -maxdepth 2 -type d -name prebuilds -prune -exec rm -rf
        {} +
      - sed -i -e '/Dependencies for Google Location Engine/,/^    }$/d' node_modules/@maplibre/maplibre-react-native/android/build.gradle
      - FDROID=1 npx expo prebuild --platform android --no-install --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - find node_modules android -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o
        -name '*.kt' \) -exec sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g'
        -e 's/jvmToolchain(17)/jvmToolchain(21)/g' -e 's/JVM_17/JVM_21/g' -e 's/fromTarget("17")/fromTarget("21")/g'
        -e 's/jvmTarget = "17"/jvmTarget = "21"/g' -e "s/jvmTarget = '17'/jvmTarget = '21'/g" {} +
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/@react-native-community/netinfo/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-maps/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - node_modules/expo-location/android
      - node_modules/react-native/React/I18n/strings
      - node_modules/fb-dotslash
      - node_modules/detox
      - node_modules/hermes-compiler/hermesc/osx-bin
      - node_modules/hermes-compiler/hermesc/win64-bin
      - node_modules/expo/template.tgz
      - node_modules/@bacons/apple-targets/prebuild-blank.tgz
      - node_modules/@expo/expo-modules-macros-plugin/apple
    build: cd android && gradle assembleRelease --max-workers=2 -PreactNativeArchitectures=arm64-v8a
    ndk: 27.1.12297006

MaintainerNotes: |-
  Draft written from the gote repo (docs/FDROID.md has the background). Built with
  `fdroid build -l` in F-Droid's buildserver Docker image on 2026-10-23 (from tag
  v2.46.0, arm64-v8a only): the source scan has no errors and `fdroid scanner` on the
  resulting APK reports nothing. Not verified: a build on the real build server, and
  more than one ABI.

  Sync across devices is deliberately off in this build: the recipe writes
  EXPO_PUBLIC_FDROID=1 into .env before the JS bundle is built, so the app has no
  sync screen, its tour has no sync steps, the Supabase address is not in the
  bundle at all, and it talks only to iNaturalist and the map tile host. It can be
  enabled in a later version by dropping that line and putting the Supabase
  service back under AntiFeatures.

  The app is built with FDROID=1 (app.config.js): that drops the Detox config
  plugin and disables expo-updates. Google Play Services are not linked on Android
  at all: expo-location, expo-updates and react-native-maps are excluded from
  Android autolinking in package.json, the Android location comes from the
  platform's LocationManager (modules/gote-location) and the maps are MapLibre with
  OpenFreeMap tiles.

