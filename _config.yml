# GitHub Pages / Jekyll config for the gote website (goteapp.com).
#
# Only the landing page (index.html) and the privacy policy (PRIVACY.md) are the
# website; everything else in this repo is the app. The exclude list keeps the
# app source, tooling and dev docs out of the published site — both to keep the
# site clean and because some dev docs contain Liquid-looking text ({{ … }})
# that Jekyll would try to interpret.

title: gote
description: >-
  Learn the species you see. Quick flashcard rounds built from real nature
  photos — birds, plants, insects, fungi and more.
url: https://goteapp.com

# Cloudflare Web Analytics beacon token (Dash ▸ Web Analytics ▸ your site ▸
# Manage site ▸ copy the value of "token" out of the snippet — just the token,
# not the whole <script> tag).
#
# Leave EMPTY to disable analytics entirely: _layouts/base.html only emits the
# beacon when this is set AND Jekyll is building for production, so a local
# `jekyll serve` never counts your own previews. The token is not a secret — it
# identifies the site, grants nothing, and is visible in the page source of
# every site using it.
#
# Chosen because it is cookieless and stores no cross-site identifier, so the
# site needs no consent banner. It measures pageviews, referrers, countries and
# Core Web Vitals only — it has NO custom events, so App Store button clicks
# are not tracked. See the "About this website" section of PRIVACY.md, which
# must keep saying whatever is true here.
cloudflare_analytics_token: "25acf0857611449290c1a5f1416469ac"

# Every page gets the article layout unless it opts out (index.html uses `base`).
defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - App.js
  - index.js
  - app.json
  - eas.json
  - package.json
  - package-lock.json
  - babel.config.js
  - tsconfig.json
  - .detoxrc.js
  - .npmrc
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - LICENSE-EXCEPTION
  - src
  - scripts
  - modules
  - targets
  - e2e
  - screenshots-local
  - supabase
  - mockups
  - docs
  - node_modules
  - vendor
