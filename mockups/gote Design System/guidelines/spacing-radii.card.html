<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Heavily rounded; full pills for chips, avatars and icon buttons" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-system); background: var(--card); padding: 24px; color: var(--text); }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .item { text-align: center; }
  .box { width: 74px; height: 74px; background: var(--faint); border: 1px solid var(--border); }
  .name { font-size: 12px; font-weight: 800; margin-top: 8px; }
  .val { font-size: 11px; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius: var(--radius-sm);"></div><div class="name">sm</div><div class="val">8px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-md);"></div><div class="name">md</div><div class="val">14px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-lg);"></div><div class="name">lg</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-xl);"></div><div class="name">xl</div><div class="val">20px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-pill);"></div><div class="name">pill</div><div class="val">999px</div></div>
  </div>
</body>
</html>
