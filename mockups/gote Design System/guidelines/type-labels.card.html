<!-- @dsCard group="Type" viewport="700x200" name="Labels & captions" subtitle="Uppercase section labels, row subtitles, hints and photo credits" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-system); background: var(--card); padding: 24px; color: var(--text); }
  .item { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-top: 1px solid var(--border); }
  .item:first-child { border-top: 0; }
  .meta { width: 150px; flex: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  .meta b { display: block; color: var(--text); font-size: 12px; font-weight: 800; }
</style>
</head>
<body>
  <div class="item">
    <div class="meta"><b>Section · 13 / 800</b>uppercase, +0.06em</div>
    <div style="font-size: var(--text-label); font-weight: 800; text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--section-label);">Play</div>
  </div>
  <div class="item">
    <div class="meta"><b>Subtitle · 13 / 400</b>row sub-copy</div>
    <div style="font-size: var(--text-sub); color: var(--muted);">Endless cards — survive 3 misses</div>
  </div>
  <div class="item">
    <div class="meta"><b>Caption · 12 / 400</b>inline hints</div>
    <div style="font-size: var(--text-caption); color: var(--muted);">Tap a species to learn more, or flag it to study later</div>
  </div>
  <div class="item">
    <div class="meta"><b>Micro · 11 / 400</b>photo credit</div>
    <div style="font-size: var(--text-micro); color: var(--muted);">© some_observer, iNaturalist</div>
  </div>
</body>
</html>
