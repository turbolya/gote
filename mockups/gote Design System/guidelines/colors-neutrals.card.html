<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals" subtitle="App background, card, text, dividers and sunken fills" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-system); background: var(--card); padding: 22px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .name { font-size: 12px; font-weight: 800; color: var(--text); margin-top: 8px; }
  .hex { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background: var(--bg);"></div><div class="name">bg</div><div class="hex">#FAFAF8</div></div>
    <div class="sw"><div class="chip" style="background: var(--card);"></div><div class="name">card</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background: var(--faint);"></div><div class="name">faint</div><div class="hex">#F0F1ED</div></div>
    <div class="sw"><div class="chip" style="background: var(--border);"></div><div class="name">border</div><div class="hex">#E7E8E3</div></div>
    <div class="sw"><div class="chip" style="background: var(--muted);"></div><div class="name">muted</div><div class="hex">#8A8F86</div></div>
    <div class="sw"><div class="chip" style="background: var(--text);"></div><div class="name">text</div><div class="hex">#1A1D1A</div></div>
  </div>
</body>
</html>
