<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px-based rhythm; 20px is the default screen padding" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-system); background: var(--card); padding: 24px; color: var(--text); }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .bar { background: var(--primary); border-radius: 3px; width: 100%; }
  .box { height: 56px; display: flex; align-items: flex-end; }
  .name { font-size: 11px; font-weight: 800; margin-top: 8px; }
  .val { font-size: 11px; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-1);"></div></div><div class="name">1</div><div class="val">4px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-2);"></div></div><div class="name">2</div><div class="val">8px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-3);"></div></div><div class="name">3</div><div class="val">12px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-4);"></div></div><div class="name">4</div><div class="val">16px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-5);"></div></div><div class="name">5</div><div class="val">20px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-6);"></div></div><div class="name">6</div><div class="val">24px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-8);"></div></div><div class="name">8</div><div class="val">32px</div></div>
    <div class="item"><div class="box"><div class="bar" style="height: var(--space-10);"></div></div><div class="name">10</div><div class="val">40px</div></div>
  </div>
</body>
</html>
