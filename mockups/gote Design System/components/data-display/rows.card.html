<!-- @dsCard group="Components" viewport="700x300" name="List rows & labels" subtitle="Accent-glyph menu rows, section labels and stat pills" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-system); background: var(--card); padding: 22px 24px; }
  .pills { display: flex; gap: 10px; margin-top: 14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./tweaks-panel.js"></script>
  <script type="text/babel">
    const { ListRow, SectionLabel, StatPill } = window.GoteDesignSystem_1d5a8c;
    const { useTweaks, TweaksPanel, TweakSection, TweakColor } = window;

    // One muted teal across every row icon — no rainbow of accents.
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "iconColor": "#147D8A"
    }/*EDITMODE-END*/;

    function Demo() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const c = t.iconColor;
      return (
        <div>
          <SectionLabel>Play</SectionLabel>
          <div>
            <ListRow icon="albums-outline" accent={c} title="By name" sub="See a photo, choose its name" />
            <ListRow divider icon="apps-outline" accent={c} title="By picture" sub="See a name, choose its photo" />
            <ListRow divider icon="flash" accent={c} title="Speedrun" sub="Endless cards — survive 3 misses" />
          </div>
          <div className="pills">
            <StatPill icon="stats-chart-outline">72% accuracy</StatPill>
            <StatPill icon="flame">12-day streak</StatPill>
          </div>

          <TweaksPanel>
            <TweakSection label="Row icons" />
            <TweakColor label="Icon color" value={t.iconColor}
              options={['#0F766E', '#147D8A', '#036178', '#008AAC']}
              onChange={(v) => setTweak('iconColor', v)} />
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
