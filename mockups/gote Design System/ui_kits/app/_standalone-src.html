<!-- Standalone export build source for gote App — not a design-system card. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gote — iOS app</title>
<link rel="stylesheet" href="../../styles.css" />
<meta name="ext-resource-dependency" content="../../assets/newt.svg" data-resource-id="newt" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
<script>
/* Standalone shim: render <ion-icon> via the inlined MDI webfont so the
   exported file works fully offline (Ionicons fetches each SVG at runtime). */
(function () {
  var MAP = {
    'cellular': 'signal', 'wifi': 'wifi', 'battery-full': 'battery',
    'chevron-back': 'chevron-left', 'chevron-forward': 'chevron-right',
    'close': 'close', 'close-circle': 'close-circle', 'checkmark-circle': 'check-circle',
    'flag-outline': 'flag-outline', 'star': 'star', 'arrow-forward': 'arrow-right',
    'grid-outline': 'grid', 'stats-chart': 'chart-bar', 'cafe-outline': 'coffee-outline',
    'albums-outline': 'image-multiple-outline', 'apps-outline': 'view-grid-outline',
    'flash': 'flash', 'compass-outline': 'compass-outline', 'options-outline': 'tune-variant',
    'documents-outline': 'file-document-multiple-outline', 'library-outline': 'bookshelf',
    'settings-outline': 'cog-outline', 'trophy': 'trophy', 'thumbs-up': 'thumb-up',
    'trending-up': 'trending-up', 'school-outline': 'school-outline', 'eye-outline': 'eye-outline',
    'play': 'play', 'home': 'home', 'search-outline': 'magnify'
  };
  class IonIcon extends HTMLElement {
    static get observedAttributes() { return ['name']; }
    connectedCallback() { this.render(); }
    attributeChangedCallback() { this.render(); }
    render() {
      var m = MAP[this.getAttribute('name') || ''] || 'help-circle-outline';
      this.style.display = 'inline-flex';
      this.style.alignItems = 'center';
      this.style.justifyContent = 'center';
      this.style.lineHeight = '1';
      this.innerHTML = '<i class="mdi mdi-' + m + '" style="font-size:inherit;line-height:1"></i>';
    }
  }
  if (!customElements.get('ion-icon')) customElements.define('ion-icon', IonIcon);
})();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-system); background: #d9dcd6;
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  /* iPhone frame */
  .phone { width: 390px; height: 844px; border-radius: 54px; background: #000;
    padding: 11px; box-shadow: 0 30px 70px rgba(0,0,0,0.35), 0 0 0 2px rgba(0,0,0,0.2); flex: none; }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; background: var(--bg); }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
  <div class="phone"><div class="screen" id="root"></div></div>

  <template id="__bundler_thumbnail" data-bg-color="#008aac">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#008aac" />
      <g fill="#ffffff">
        <ellipse cx="600" cy="430" rx="120" ry="70" />
        <circle cx="600" cy="330" r="78" />
        <circle cx="576" cy="318" r="12" fill="#008aac" />
        <circle cx="624" cy="318" r="12" fill="#008aac" />
        <path d="M600 500 q90 30 150 -40 q20 60 -40 100 q-70 36 -150 -10 z" />
        <rect x="470" y="470" width="36" height="90" rx="18" />
        <rect x="694" y="470" width="36" height="90" rx="18" />
      </g>
      <text x="600" y="660" font-family="sans-serif" font-size="96" font-weight="700" fill="#ffffff" text-anchor="middle">gote</text>
    </svg>
  </template>

  <script src="data.js"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="MenuScreen.jsx"></script>
  <script type="text/babel" src="StudyScreen.jsx"></script>
  <script type="text/babel" src="ResultsScreen.jsx"></script>
  <script type="text/babel" src="LexiconScreen.jsx"></script>
  <script type="text/babel">
    const { MenuScreen, StudyScreen, ResultsScreen, LexiconScreen, HomeIndicator, QUIZ_CARDS, SPECIES } = window.GOTE;

    function App() {
      const [screen, setScreen] = React.useState('menu');
      const [idx, setIdx] = React.useState(0);
      const [score, setScore] = React.useState(0);
      const [missed, setMissed] = React.useState([]);

      const startGame = () => { setIdx(0); setScore(0); setMissed([]); setScreen('study'); };

      // Advance the quiz; the StudyScreen reports nothing back here, so we
      // simulate a graded result based on whether this card was "known".
      const nextCard = (gotIt) => {
        const card = QUIZ_CARDS[idx];
        if (gotIt) setScore((s) => s + 1);
        else {
          const sp = SPECIES.find((s) => s.common === card.answer);
          if (sp) setMissed((m) => [...m, sp]);
        }
        if (idx + 1 >= QUIZ_CARDS.length) setScreen('results');
        else setIdx(idx + 1);
      };

      let view;
      if (screen === 'menu')
        view = <MenuScreen onSelectMode={startGame} onLexicon={() => setScreen('lexicon')} onStats={() => {}} />;
      else if (screen === 'study')
        view = <StudyScreen card={QUIZ_CARDS[idx]} index={idx} total={QUIZ_CARDS.length} score={score}
          onNext={nextCard} onQuit={() => setScreen('menu')} />;
      else if (screen === 'results')
        view = <ResultsScreen total={QUIZ_CARDS.length} correct={score} missed={missed}
          onPlayAgain={startGame} onMenu={() => setScreen('menu')} onRevisit={startGame} />;
      else if (screen === 'lexicon')
        view = <LexiconScreen onBack={() => setScreen('menu')} />;

      const needsIndicator = screen === 'menu';
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>{view}</div>
          {needsIndicator && <HomeIndicator dark />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
